name: Update featured projects

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Redraw featured repo cards
        run: node .github/scripts/update-featured.mjs
        env:
          # The default GITHUB_TOKEN can't see other private repos, so this needs a
          # personal token with read-only Metadata access to all your repositories.
          GH_TOKEN: ${{ secrets.FEATURED_TOKEN }}

      - name: Commit if changed
        run: |
          git add README.md assets/featured
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update featured projects"
          git push
